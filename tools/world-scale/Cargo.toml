[package]
name = "bevy_world_scale"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
client = [
  "bevy/default_app",
  "bevy/2d_bevy_render",
  "bevy/bevy_winit",
  "bevy/multi_threaded",
  "bevy/png",
  "bevy/std",
  "bevy/webgl2",
  "bevy/x11",
]

[dependencies]
bevy = { path = "../..", default-features = false, features = ["bevy_log"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "ErrorEvent", "MessageEvent", "WebSocket", "Window"] }

[[bin]]
name = "world_scale_client"
path = "src/bin/world_scale_client.rs"
required-features = ["client"]

[lints]
workspace = true

